{% comment %}
Icon paths for the rail, keyed by `icon` -- either a literal ("overview",
"site") or a model's lowercased object_name.

Paths only: the caller supplies the <svg> wrapper, so stroke width, size and
colour are declared once rather than copied into every branch.

These are the same Lucide glyphs the app rail uses (lucide-react in
components/dashboard/IconRail.tsx), traced out as markup because the admin is
server-rendered and pulling a React icon library into it to draw four shapes
would be absurd. Keep them in step with the app's if those change.

A model with no branch here falls through to the database glyph, so registering
a new ModelAdmin gives a sensible rail item without touching this file.
{% endcomment %}

  <rect width="7" height="7" x="14" y="3" rx="1"/>
  <rect width="7" height="7" x="14" y="14" rx="1"/>
  <rect width="7" height="7" x="3" y="14" rx="1"/>
