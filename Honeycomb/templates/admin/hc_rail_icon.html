{% comment %}
Icon paths for the rail, keyed by `icon` -- either a literal ("overview",
"site") or a model's lowercased object_name.

Paths only: the caller supplies the <svg> wrapper, so stroke width, size and
colour are declared once rather than copied into every branch.

These are Lucide glyphs, the same family the app rail uses (lucide-react in
components/dashboard/IconRail.tsx), traced out as markup because the admin is
server-rendered and pulling a React icon library into it to draw a dozen shapes
would be absurd. The path data is copied verbatim from the installed
lucide-react package, so a glyph here is identical to the same glyph there --
if you add one, copy it from `node_modules/lucide-react/dist/esm/icons/<name>.mjs`
rather than drawing it, or the stroke will not match its neighbours.

**Every registered ModelAdmin needs a branch.** A model with none falls through
to the database glyph, which is a sane default for one model and useless for
nine -- a rail of identical cylinders is a rail with no navigation in it. If you
register a model, add it here in the same commit.

Current branches cover, in `available_apps` order: accounts (Tenant, User),
auth (Group), connections (Connection, ConnectorOAuthState) and mcp (McpKey,
McpActivity).
{% endcomment %}
