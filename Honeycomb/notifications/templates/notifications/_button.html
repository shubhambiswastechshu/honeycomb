{% comment %}One call-to-action button. `url` and `label` come from the caller.{% endcomment %}
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:22px 0;">
  <tr>
    <td style="background:#1f883d;border-radius:7px;">
      <a href="{{ url }}" style="display:inline-block;padding:12px 22px;font-size:15px;font-weight:600;color:#ffffff;text-decoration:none;">{{ label }}</a>
    </td>
  </tr>
</table>
