# Render blueprint. In the dashboard: New > Blueprint, point it at this repo.
#
# Three resources: a Postgres database, the Django API, and the Next.js
# frontend. The frontend proxies /api/* through to the API (see
# frontend/next.config.mjs), so the browser only ever talks to one origin --
# which is what lets the auth cookies stay SameSite=Lax. *.onrender.com
# subdomains are separate sites to a browser, so calling the API directly from
# the frontend's origin would silently drop every cookie.

databases:
  - name: honeycomb-db
    databaseName: honeycomb
    user: honeycomb
    plan: free

services:
  # ---- Django API ----
  - type: web
    name: honeycomb-api
    runtime: python
    plan: free
    region: oregon
    rootDir: Honeycomb
    buildCommand: "./build.sh"
    # ASGI, not WSGI. /mcp/* is a FastAPI app composed beside Django in
    # Honeycomb/asgi.py; served through Honeycomb.wsgi it simply would not
    # exist. gunicorn stays as the process manager (restarts, worker
    # supervision) and uvicorn supplies the worker class underneath it.
    #
    # --timeout 120 against HONEYCOMB_MCP_TOOL_TIMEOUT=45: gunicorn kills a
    # worker it thinks is wedged, and a connector legitimately spending its
    # full 45s waiting on a slow third-party API is not wedged. At the old 60
    # there was 15s of headroom for everything else the worker was doing --
    # including other concurrent requests, since one async worker handles many
    # at once. A killed worker returns nothing an MCP client can parse, which
    # the user reads as the session dying rather than as one slow tool.
    startCommand: "gunicorn Honeycomb.asgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    healthCheckPath: /api/auth/csrf/
    envVars:
      - key: PYTHON_VERSION
        # psycopg 3.3 requires >=3.10. Pinned rather than left to Render's
        # default so a base-image change cannot break the build.
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: honeycomb-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_JWT_SIGNING_KEY
        # Separate from SECRET_KEY so JWTs can be rotated (signing everyone
        # out) without also invalidating sessions and CSRF tokens.
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_NUM_PROXIES
        # Render's edge is a single proxy and it overwrites X-Forwarded-For,
        # so the client IP is exactly one hop back. Wrong values here make
        # every rate limit forgeable.
        value: "1"
      - key: DJANGO_DB_SSLMODE
        value: require
      - key: WEB_CONCURRENCY
        value: "2"
      # Set after the first deploy, once the frontend URL exists:
      #   DJANGO_PUBLIC_ORIGINS=https://honeycomb-web.onrender.com
      # Until it is set, CSRF rejects writes from the deployed frontend.
      - key: DJANGO_PUBLIC_ORIGINS
        sync: false
      # Fernet keys for connector credentials at rest, comma separated, newest
      # first. Not generateValue: Render emits a random hex string, and Fernet
      # requires 32 url-safe base64 bytes, so it would fail at first decrypt
      # rather than at boot. Generate and paste:
      #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      # Rotating means PREPENDING a new key and leaving the old one until every
      # row has been re-saved. Losing the last key that encrypted a row loses
      # that credential permanently.
      - key: HONEYCOMB_CRED_KEYS
        sync: false
      # The origin an AI client dials, used to build every mcp_url the portal
      # hands out. This one is THIS service's own public URL, not the
      # frontend's -- the single-origin proxying above exists to keep browser
      # cookies SameSite=Lax, and an MCP client is not a browser and carries no
      # cookie, so it can talk to the API directly. (Point it at the frontend
      # instead only if next.config.mjs is given an /mcp/* rewrite too.)
      #
      # Set after the first deploy, alongside DJANGO_PUBLIC_ORIGINS. Render has
      # no blueprint property that yields a full https:// URL, hence sync:false
      # rather than fromService. No trailing slash. Treat it as permanent:
      # users paste the URLs built from it into Claude or Cursor, and changing
      # it silently breaks every config already out there.
      #   HONEYCOMB_PUBLIC_BASE=https://honeycomb-api.onrender.com
      - key: HONEYCOMB_PUBLIC_BASE
        sync: false
      # Ceiling on one tools/call. Must stay well under gunicorn's --timeout
      # above; raise both together or neither.
      - key: HONEYCOMB_MCP_TOOL_TIMEOUT
        value: "45"

  # ---- Next.js frontend ----
  - type: web
    name: honeycomb-web
    runtime: node
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: "npm ci && npm run build"
    startCommand: "npm run start -- --port $PORT"
    envVars:
      - key: NODE_VERSION
        value: "22.11.0"
      # Server-side only. next.config.mjs proxies /api/* here, so this value
      # never reaches the browser and needs no NEXT_PUBLIC_ prefix.
      - key: API_ORIGIN
        fromService:
          name: honeycomb-api
          type: web
          property: hostport
      # Empty on purpose: the client calls same-origin /api, and
      # lib/api.ts already falls back to a relative base when this is unset.
      - key: NEXT_PUBLIC_API_BASE_URL
        value: "/api"
