# Coolify deployment for Honeycomb. Same shape as the bringdata app already on
# this server: build pack "dockercompose", this file as the compose location.
#
# Four services. Redis is not optional here even though the app boots without
# it: every rate limit in this project lives in Django's cache, and with the
# per-process LocMemCache each worker keeps its own counters, so the published
# limits are silently multiplied by the worker count. On a machine-driven MCP
# endpoint that is the difference between a throttle and a decoration.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: honeycomb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: honeycomb
    volumes:
      - honeycomb_pg2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U honeycomb"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - honeycomb_redis2:/data

  backend:
    build:
      context: ./Honeycomb
    restart: unless-stopped
    environment:
      SERVICE_FQDN_BACKEND_8000: /
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DB_ENGINE: postgres
      DJANGO_DB_NAME: honeycomb
      DJANGO_DB_USER: honeycomb
      DJANGO_DB_PASSWORD: ${POSTGRES_PASSWORD}
      DJANGO_DB_HOST: postgres
      DJANGO_DB_PORT: "5432"
      # Outside DEBUG the project requires TLS to the database, which is the
      # right default when the database is on another host. Here it is a
      # sibling container on a private Docker network on this same machine,
      # and postgres:16-alpine ships without TLS -- so psycopg refuses to
      # connect at all, migrate fails, and the container crash-loops while the
      # deploy reports success. The setting exists to be relaxed exactly here.
      # If Postgres ever moves off this host, this must go back to require.
      DJANGO_DB_SSLMODE: disable
      # Coolify's proxy is the only hop in front of this container. If that
      # ever changes, this number must change with it: get it wrong and
      # X-Forwarded-For becomes caller-controlled and every throttle is
      # bypassable. HANDOFF invariant 6, and it was a real finding.
      DJANGO_NUM_PROXIES: "1"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DJANGO_PUBLIC_ORIGINS: ${DJANGO_PUBLIC_ORIGINS}
      REDIS_URL: redis://redis:6379/0
      # Lose this and every stored connector credential is unrecoverable --
      # there is no reset path, only reconnecting each source by hand. Back it
      # up somewhere that is not this server.
      HONEYCOMB_CRED_KEYS: ${HONEYCOMB_CRED_KEYS}
      # Must match the redirect URI registered on the Google OAuth client,
      # byte for byte, scheme included.
      HONEYCOMB_PUBLIC_BASE: ${HONEYCOMB_PUBLIC_BASE}
      HONEYCOMB_FRONTEND_BASE: ${HONEYCOMB_FRONTEND_BASE}
      HONEYCOMB_MCP_TOOL_TIMEOUT: ${HONEYCOMB_MCP_TOOL_TIMEOUT:-45}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${GOOGLE_ADS_DEVELOPER_TOKEN:-}
      GOOGLE_ADS_API_VERSION: ${GOOGLE_ADS_API_VERSION:-v23}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # See Honeycomb/healthcheck.py -- it has to claim X-Forwarded-Proto, or
      # SECURE_SSL_REDIRECT answers the check with a 301 to a localhost URL
      # that has no certificate, and a healthy container looks dead.
      test: ["CMD", "python", "healthcheck.py"]
      interval: 15s
      timeout: 6s
      retries: 10
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the bundle: the browser calls the API directly, so this
        # is a public origin, not the internal service name -- and it must end
        # in /api, which is what lib/api.ts expects.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    restart: unless-stopped
    environment:
      SERVICE_FQDN_FRONTEND_3000: /
    depends_on:
      - backend

volumes:
  honeycomb_pg2:
  honeycomb_redis2:
